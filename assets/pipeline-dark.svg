<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="t">
  <title id="t">Ilyass Hakim — I build software end to end, and the pipelines that ship it.</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>

    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="45%"  stop-color="#a5d6ff"/>
      <stop offset="100%" stop-color="#d2a8ff"/>
    </linearGradient>

    <linearGradient id="edge" x1="-0.7" y1="0" x2="-0.2" y2="0">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="45%" stop-color="#58a6ff"/>
      <stop offset="55%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#30363d"/>
      <animate attributeName="x1" values="-0.7;1.0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-0.2;1.5" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#bc8cff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" opacity="0.55"/>
    </pattern>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="368" rx="14"/></clipPath>
    <style>
      .f { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .rail { stroke: #30363d; stroke-width: 2; stroke-linecap: round; }
      .pulse {
        stroke: url(#flow); stroke-width: 3; stroke-linecap: round; fill: none;
        stroke-dasharray: 920; stroke-dashoffset: 920;
        animation: draw 7s cubic-bezier(.45,.05,.35,1) infinite;
      }
      @keyframes draw { 0% { stroke-dashoffset: 920 } 55%,100% { stroke-dashoffset: 0 } }
      .node { fill: #161b22; stroke: #30363d; stroke-width: 2.5; animation: lit 7s ease-in-out infinite; }
      .cap  { fill: #6e7681; animation: capLit 7s ease-in-out infinite; }
      .tool { fill: #484f58; animation: toolLit 7s ease-in-out infinite; }
      @keyframes lit {
        0%, 6%   { fill: #161b22; stroke: #30363d; }
        12%, 92% { fill: #0d1117; stroke: #3fb950; }
        98%,100% { fill: #161b22; stroke: #30363d; }
      }
      @keyframes capLit {
        0%, 6%   { fill: #6e7681; }
        12%, 92% { fill: #e6edf3; }
        98%,100% { fill: #6e7681; }
      }
      @keyframes toolLit {
        0%, 6%   { fill: #484f58; }
        12%, 92% { fill: #7d8590; }
        98%,100% { fill: #484f58; }
      }
      .n2,.c2 { animation-delay: .75s }
      .n3,.c3 { animation-delay: 1.5s }
      .n4,.c4 { animation-delay: 2.25s }
      .n5,.c5 { animation-delay: 3s }
      .tick { opacity: 0; animation: show 7s ease-out infinite; animation-delay: 3.6s; }
      @keyframes show { 0% { opacity: 0 } 8%,88% { opacity: 1 } 96%,100% { opacity: 0 } }
      .cursor { animation: blink 1.1s step-end infinite; }
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
      .corner { stroke: #3fb950; stroke-width: 2; fill: none; stroke-linecap: round; opacity: .5 }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="368" rx="14" fill="url(#panel)" stroke="url(#edge)" stroke-width="2.5"/>
  <g clip-path="url(#clip)">
    <rect x="1" y="65" width="1198" height="304" fill="url(#dots)"/>
    <ellipse cx="600" cy="175" rx="480" ry="125" fill="url(#glow)"/>
  </g>

  <path class="corner" d="M300 112 h-26 v26"/>
  <path class="corner" d="M900 112 h26 v26"/>
  <path class="corner" d="M300 244 h-26 v-26"/>
  <path class="corner" d="M900 244 h26 v-26"/>

  <circle cx="34" cy="34" r="6" fill="#ff5f57"/>
  <circle cx="56" cy="34" r="6" fill="#febc2e"/>
  <circle cx="78" cy="34" r="6" fill="#28c840"/>
  <text class="m" x="104" y="39" font-size="13" fill="#6e7681">ilyass-hakim — pipeline/main</text>

  <g class="tick" transform="translate(1078,22)">
    <rect x="0" y="0" width="86" height="25" rx="12" fill="#0d1117" stroke="#3fb950"/>
    <path d="M13 12.5 l4 4 l8 -9" stroke="#3fb950" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="m" x="34" y="17" font-size="11" fill="#3fb950">passed</text>
  </g>
  <path d="M1 64 H1199" stroke="#30363d" stroke-width="1"/>

  <text class="f" x="600" y="168" font-size="70" font-weight="800" letter-spacing="-2" text-anchor="middle" fill="url(#name)">Ilyass Hakim</text>
  <text class="f" x="600" y="207" font-size="21" text-anchor="middle" fill="#8b949e">I build software end to end — and the pipelines that ship it.</text>
  <text class="m" x="600" y="238" font-size="14" letter-spacing="1" text-anchor="middle" fill="#58a6ff">backend<tspan fill="#484f58"> · </tspan>mobile<tspan fill="#484f58"> · </tspan>devsecops<tspan fill="#484f58"> · </tspan>infrastructure<tspan fill="#484f58"> · </tspan>applied ai<tspan class="cursor" fill="#3fb950">_</tspan></text>

  <path class="rail"  d="M110 292 H1030"/>
  <path class="pulse" d="M110 292 H1030"/>

  <g fill="none" stroke="#3fb950" stroke-width="2.5">
    <circle cx="110" cy="292" r="10" opacity="0">
      <animate attributeName="r" values="10;10;34;34" keyTimes="0;.10;.32;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.75;0;0" keyTimes="0;.11;.32;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="292" r="10" opacity="0">
      <animate attributeName="r" values="10;10;34;34" keyTimes="0;.10;.32;1" dur="7s" begin="0.75s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.75;0;0" keyTimes="0;.11;.32;1" dur="7s" begin="0.75s" repeatCount="indefinite"/>
    </circle>
    <circle cx="570" cy="292" r="10" opacity="0">
      <animate attributeName="r" values="10;10;34;34" keyTimes="0;.10;.32;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.75;0;0" keyTimes="0;.11;.32;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="292" r="10" opacity="0">
      <animate attributeName="r" values="10;10;34;34" keyTimes="0;.10;.32;1" dur="7s" begin="2.25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.75;0;0" keyTimes="0;.11;.32;1" dur="7s" begin="2.25s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="292" r="10" opacity="0">
      <animate attributeName="r" values="10;10;34;34" keyTimes="0;.10;.32;1" dur="7s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.75;0;0" keyTimes="0;.11;.32;1" dur="7s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle class="node n1" cx="110"  cy="292" r="10"/>
  <circle class="node n2" cx="340"  cy="292" r="10"/>
  <circle class="node n3" cx="570"  cy="292" r="10"/>
  <circle class="node n4" cx="800"  cy="292" r="10"/>
  <circle class="node n5" cx="1030" cy="292" r="10"/>

  <text class="m cap c1" x="110"  y="323" font-size="12" letter-spacing="2" text-anchor="middle">CODE</text>
  <text class="m cap c2" x="340"  y="323" font-size="12" letter-spacing="2" text-anchor="middle">BUILD</text>
  <text class="m cap c3" x="570"  y="323" font-size="12" letter-spacing="2" text-anchor="middle">SCAN</text>
  <text class="m cap c4" x="800"  y="323" font-size="12" letter-spacing="2" text-anchor="middle">SHIP</text>
  <text class="m cap c5" x="1030" y="323" font-size="12" letter-spacing="2" text-anchor="middle">RUN</text>

  <text class="m tool c1" x="110"  y="344" font-size="10.5" text-anchor="middle">git</text>
  <text class="m tool c2" x="340"  y="344" font-size="10.5" text-anchor="middle">maven · gradle</text>
  <text class="m tool c3" x="570"  y="344" font-size="10.5" text-anchor="middle">gitleaks · sonar · semgrep · owasp</text>
  <text class="m tool c4" x="800"  y="344" font-size="10.5" text-anchor="middle">artifactory · docker hub</text>
  <text class="m tool c5" x="1030" y="344" font-size="10.5" text-anchor="middle">kubernetes · ansible</text>
</svg>
