<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="at">
  <title id="at">sensai architecture — Compose Android client, Spring Boot API, PostgreSQL, Redis and a local Ollama model.</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="edge" x1="-0.7" y1="0" x2="-0.2" y2="0">
      <stop offset="0%" stop-color="#30363d"/><stop offset="45%" stop-color="#58a6ff"/>
      <stop offset="55%" stop-color="#bc8cff"/><stop offset="100%" stop-color="#30363d"/>
      <animate attributeName="x1" values="-0.7;1.0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-0.2;1.5" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" opacity="0.55"/>
    </pattern>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="398" rx="14"/></clipPath>
    <style>
      .f { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .box  { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
      .hero { fill: #0d1117; stroke: #58a6ff; stroke-width: 2; }
      .ttl  { fill: #e6edf3; font-weight: 700; }
      .sub  { fill: #6e7681; }
      .wire { fill: none; stroke: #30363d; stroke-width: 1.5; }
      .pill { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="398" rx="14" fill="url(#panel)" stroke="url(#edge)" stroke-width="2.5"/>
  <g clip-path="url(#clip)"><rect x="1" y="65" width="1198" height="334" fill="url(#dots)"/></g>

  <circle cx="34" cy="34" r="6" fill="#ff5f57"/>
  <circle cx="56" cy="34" r="6" fill="#febc2e"/>
  <circle cx="78" cy="34" r="6" fill="#28c840"/>
  <text class="m" x="104" y="39" font-size="13" fill="#6e7681">sensai — architecture</text>
  <g transform="translate(1090,22)">
    <rect x="0" y="0" width="74" height="25" rx="12" class="pill"/>
    <circle cx="16" cy="12.5" r="4" fill="#3fb950">
      <animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text class="m" x="30" y="17" font-size="11" fill="#7d8590">live</text>
  </g>
  <path d="M1 64 H1199" stroke="#30363d" stroke-width="1"/>

  <path id="p1" class="wire" d="M262 212 H438"/>
  <path id="p2" class="wire" d="M732 178 C800 178 838 150 898 150"/>
  <path id="p3" class="wire" d="M732 212 H898"/>
  <path id="p4" class="wire" d="M732 246 C800 246 838 330 898 330"/>

  <g>
    <circle r="4" fill="#58a6ff"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath xlink:href="#p1"/></animateMotion></circle>
    <circle r="3.5" fill="#3fb950"><animateMotion dur="2.6s" begin="0.4s" repeatCount="indefinite"><mpath xlink:href="#p2"/></animateMotion></circle>
    <circle r="3.5" fill="#f0883e"><animateMotion dur="1.9s" begin="0.9s" repeatCount="indefinite"><mpath xlink:href="#p3"/></animateMotion></circle>
    <circle r="3.5" fill="#bc8cff"><animateMotion dur="3s" begin="1.3s" repeatCount="indefinite"><mpath xlink:href="#p4"/></animateMotion></circle>
  </g>

  <rect x="70" y="152" width="192" height="120" rx="10" class="box"/>
  <text class="f ttl" x="166" y="196" font-size="19" text-anchor="middle">Android</text>
  <text class="m sub" x="166" y="220" font-size="11" text-anchor="middle">Jetpack Compose</text>
  <text class="m sub" x="166" y="238" font-size="11" text-anchor="middle">Hilt · Retrofit</text>
  <text class="m" x="166" y="258" font-size="10" text-anchor="middle" fill="#484f58">Kotlin</text>

  <rect x="438" y="122" width="294" height="180" rx="10" class="hero"/>
  <text class="f ttl" x="585" y="166" font-size="22" text-anchor="middle">Spring Boot API</text>
  <text class="m" x="585" y="192" font-size="11.5" text-anchor="middle" fill="#8b949e">REST · WebSocket · JWT</text>
  <text class="m" x="585" y="212" font-size="11.5" text-anchor="middle" fill="#8b949e">Flyway · Bucket4j · Actuator</text>
  <line x1="478" y1="232" x2="692" y2="232" stroke="#21262d" stroke-width="1"/>
  <text class="m sub" x="585" y="254" font-size="10.5" text-anchor="middle">41 classes · 9 migrations</text>
  <text class="m" x="585" y="276" font-size="10" text-anchor="middle" fill="#484f58">Java 21</text>

  <rect x="898" y="118" width="232" height="64" rx="10" class="box"/>
  <circle cx="928" cy="150" r="5" fill="#3fb950"/>
  <text class="f ttl" x="950" y="145" font-size="15">PostgreSQL 16</text>
  <text class="m sub" x="950" y="164" font-size="10.5">relational store</text>

  <rect x="898" y="208" width="232" height="64" rx="10" class="box"/>
  <circle cx="928" cy="240" r="5" fill="#f0883e"/>
  <text class="f ttl" x="950" y="235" font-size="15">Redis 7</text>
  <text class="m sub" x="950" y="254" font-size="10.5">cache · rate limits</text>

  <rect x="898" y="298" width="232" height="64" rx="10" class="box"/>
  <circle cx="928" cy="330" r="5" fill="#bc8cff"/>
  <text class="f ttl" x="950" y="325" font-size="15">Ollama</text>
  <text class="m sub" x="950" y="344" font-size="10.5">local LLM inference</text>

  <text class="m" x="350" y="205" font-size="9.5" text-anchor="middle" fill="#484f58">HTTPS · WS</text>
  <text class="m" x="1014" y="382" font-size="9.5" text-anchor="middle" fill="#484f58">all three containerised · docker compose</text>
</svg>
