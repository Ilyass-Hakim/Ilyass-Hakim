<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="wt">
  <title id="wt">Ship it: Jenkins declarative pipelines running Gitleaks, SonarQube, Semgrep and OWASP Dependency-Check, publishing to Artifactory and Docker Hub, deploying to Kubernetes through Ansible and filing findings into DefectDojo. Serve it: layered services on Spring Boot and ASP.NET Core with REST and WebSocket APIs, JWT and OAuth2, versioned migrations, Redis caching, rate limiting, OpenAPI docs and health checks. Reach it: native Android in Jetpack Compose with Hilt and Retrofit, cross-platform work in React, React Native and Flutter, web front ends in Angular and Thymeleaf. Teach it something: machine learning and applied AI — training and evaluating models, natural language and computer vision, and the engineering that puts inference into a product instead of a notebook.</title>
  <defs>
    <style>
      .f  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .h  { fill: #1f2328; font-weight: 800; letter-spacing: -.5px; }
      .p  { fill: #59636e; }
      .gh { fill: none; stroke-width: 1.5; opacity: .16; font-weight: 800; }
      .hair { stroke: #e4e8ed; stroke-width: 1; }
      .key  { stroke-width: 3; stroke-linecap: round; }
      .ul   { stroke-width: 2.5; stroke-linecap: round;
              stroke-dasharray: 76; stroke-dashoffset: 76;
              animation: ul 9s cubic-bezier(.4,0,.2,1) infinite; }
      @keyframes ul { 0%,4% { stroke-dashoffset: 76 } 14%,86% { stroke-dashoffset: 0 } 96%,100% { stroke-dashoffset: 76 } }
      .breathe { animation: breathe 9s ease-in-out infinite; }
      @keyframes breathe { 0%,6% { opacity: .07 } 16%,84% { opacity: .22 } 94%,100% { opacity: .07 } }
      .d2 { animation-delay: .7s } .d3 { animation-delay: 1.4s } .d4 { animation-delay: 2.1s }
    </style>
  </defs>

  <path class="hair" d="M600 34 V486"/>
  <path class="hair" d="M40 260 H1160"/>

  <g stroke="#d0d7de" stroke-width="1.5" fill="none" opacity=".8">
    <path d="M40 52 V34 H58"/>
    <path d="M1160 52 V34 H1142"/>
    <path d="M40 468 V486 H58"/>
    <path d="M1160 468 V486 H1142"/>
  </g>

  <g>
    <text class="f gh breathe" x="540" y="88" font-size="94" stroke="#1a7f37" text-anchor="end">01</text>
    <path class="key" stroke="#1a7f37" d="M40 62 V196"/>
    <text class="f h" x="68" y="92" font-size="31">Ship it</text>
    <path class="ul" stroke="#1a7f37" d="M68 108 H144"/>
    <text class="f p" x="68" y="140" font-size="13.5">Jenkins declarative pipelines that build, then run Gitleaks, SonarQube,</text>
    <text class="f p" x="68" y="163" font-size="13.5">Semgrep and OWASP Dependency-Check, publish to Artifactory and Docker Hub,</text>
    <text class="f p" x="68" y="186" font-size="13.5">deploy to Kubernetes through Ansible, and file every finding into DefectDojo.</text>
  </g>

  <g>
    <text class="f gh breathe d2" x="1140" y="88" font-size="94" stroke="#0969da" text-anchor="end">02</text>
    <path class="key" stroke="#0969da" d="M640 62 V196"/>
    <text class="f h" x="668" y="92" font-size="31">Serve it</text>
    <path class="ul d2" stroke="#0969da" d="M668 108 H744"/>
    <text class="f p" x="668" y="140" font-size="13.5">Layered services on Spring Boot and ASP.NET Core — REST and WebSocket</text>
    <text class="f p" x="668" y="163" font-size="13.5">APIs, JWT and OAuth2, versioned migrations, Redis caching, rate limiting,</text>
    <text class="f p" x="668" y="186" font-size="13.5">OpenAPI docs, health checks.</text>
  </g>

  <g>
    <text class="f gh breathe d3" x="540" y="356" font-size="94" stroke="#8250df" text-anchor="end">03</text>
    <path class="key" stroke="#8250df" d="M40 330 V464"/>
    <text class="f h" x="68" y="360" font-size="31">Reach it</text>
    <path class="ul d3" stroke="#8250df" d="M68 376 H144"/>
    <text class="f p" x="68" y="408" font-size="13.5">Native Android in Jetpack Compose with Hilt and Retrofit, cross-platform</text>
    <text class="f p" x="68" y="431" font-size="13.5">work in React, React Native and Flutter, web front ends in Angular</text>
    <text class="f p" x="68" y="454" font-size="13.5">and Thymeleaf.</text>
  </g>

  <g>
    <text class="f gh breathe d4" x="1140" y="356" font-size="94" stroke="#bc4c00" text-anchor="end">04</text>
    <path class="key" stroke="#bc4c00" d="M640 330 V464"/>
    <text class="f h" x="668" y="360" font-size="31">Teach it something</text>
    <path class="ul d4" stroke="#bc4c00" d="M668 376 H744"/>
    <text class="f p" x="668" y="408" font-size="13.5">Machine learning and applied AI — training and evaluating models,</text>
    <text class="f p" x="668" y="431" font-size="13.5">natural language and computer vision, and the engineering that puts</text>
    <text class="f p" x="668" y="454" font-size="13.5">inference into a product instead of a notebook.</text>
  </g>
</svg>
