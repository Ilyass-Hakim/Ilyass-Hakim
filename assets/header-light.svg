<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t">
  <title id="t">Ilyass Hakim — I build software end to end, and the pipelines that ship it.</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a7f37"/>
      <stop offset="50%" stop-color="#0969da"/>
      <stop offset="100%" stop-color="#8250df"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f2328"/>
      <stop offset="100%" stop-color="#59636e"/>
    </linearGradient>
    <style>
      .f { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .rail { stroke: #d0d7de; stroke-width: 2; stroke-linecap: round; }
      .pulse {
        stroke: url(#flow); stroke-width: 2.5; stroke-linecap: round; fill: none;
        stroke-dasharray: 920; stroke-dashoffset: 920;
        animation: draw 7s cubic-bezier(.45,.05,.35,1) infinite;
      }
      @keyframes draw { 0% { stroke-dashoffset: 920 } 55%,100% { stroke-dashoffset: 0 } }
      .node { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 2; animation: lit 7s ease-in-out infinite; }
      .cap  { fill: #818b98; animation: capLit 7s ease-in-out infinite; }
      @keyframes lit {
        0%, 6%   { fill: #f6f8fa; stroke: #d0d7de; }
        12%, 92% { fill: #ffffff; stroke: #1a7f37; }
        98%,100% { fill: #f6f8fa; stroke: #d0d7de; }
      }
      @keyframes capLit {
        0%, 6%   { fill: #818b98; }
        12%, 92% { fill: #1f2328; }
        98%,100% { fill: #818b98; }
      }
      .n2,.c2 { animation-delay: .75s }
      .n3,.c3 { animation-delay: 1.5s }
      .n4,.c4 { animation-delay: 2.25s }
      .n5,.c5 { animation-delay: 3s }
      .tick { opacity: 0; animation: show 7s ease-out infinite; animation-delay: 3.6s; }
      @keyframes show { 0% { opacity: 0 } 8%,88% { opacity: 1 } 96%,100% { opacity: 0 } }
      .cursor { animation: blink 1.1s step-end infinite; }
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="14" fill="url(#panel)" stroke="#d0d7de"/>

  <circle cx="34" cy="34" r="6" fill="#ff5f57"/>
  <circle cx="56" cy="34" r="6" fill="#febc2e"/>
  <circle cx="78" cy="34" r="6" fill="#28c840"/>
  <text class="m" x="104" y="39" font-size="13" fill="#818b98">ilyass-hakim — pipeline/main</text>
  <path d="M1 64 H1199" stroke="#d0d7de" stroke-width="1"/>

  <text class="f" x="48" y="142" font-size="54" font-weight="700" fill="url(#ink)">Ilyass Hakim</text>
  <text class="f" x="50" y="180" font-size="19" fill="#59636e">I build software end to end — and the pipelines that ship it.</text>
  <text class="m" x="50" y="208" font-size="14" fill="#0969da">backend<tspan fill="#818b98"> · </tspan>mobile<tspan fill="#818b98"> · </tspan>devsecops<tspan fill="#818b98"> · </tspan>infrastructure<tspan fill="#818b98"> · </tspan>applied ai<tspan class="cursor" fill="#1a7f37">_</tspan></text>

  <path class="rail"  d="M110 252 H1030"/>
  <path class="pulse" d="M110 252 H1030"/>

  <circle class="node n1" cx="110"  cy="252" r="9"/>
  <circle class="node n2" cx="340"  cy="252" r="9"/>
  <circle class="node n3" cx="570"  cy="252" r="9"/>
  <circle class="node n4" cx="800"  cy="252" r="9"/>
  <circle class="node n5" cx="1030" cy="252" r="9"/>

  <text class="m cap c1" x="110"  y="282" font-size="12" letter-spacing="2" text-anchor="middle">CODE</text>
  <text class="m cap c2" x="340"  y="282" font-size="12" letter-spacing="2" text-anchor="middle">BUILD</text>
  <text class="m cap c3" x="570"  y="282" font-size="12" letter-spacing="2" text-anchor="middle">SCAN</text>
  <text class="m cap c4" x="800"  y="282" font-size="12" letter-spacing="2" text-anchor="middle">SHIP</text>
  <text class="m cap c5" x="1030" y="282" font-size="12" letter-spacing="2" text-anchor="middle">RUN</text>

  <g class="tick" transform="translate(1075,240)">
    <rect x="0" y="0" width="76" height="24" rx="12" fill="#ffffff" stroke="#1a7f37"/>
    <path d="M12 12 l4 4 l8 -9" stroke="#1a7f37" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="m" x="32" y="16" font-size="11" fill="#1a7f37">passed</text>
  </g>
</svg>
