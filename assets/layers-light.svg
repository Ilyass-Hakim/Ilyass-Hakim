<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="lt">
  <title id="lt">The whole stack — development, DevSecOps, cloud and orchestration, Linux and systems administration.</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="edge" x1="-0.7" y1="0" x2="-0.2" y2="0">
      <stop offset="0%" stop-color="#d0d7de"/><stop offset="45%" stop-color="#0969da"/>
      <stop offset="55%" stop-color="#8250df"/><stop offset="100%" stop-color="#d0d7de"/>
      <animate attributeName="x1" values="-0.7;1.0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-0.2;1.5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0969da"/><stop offset="35%" stop-color="#1a7f37"/>
      <stop offset="70%" stop-color="#8250df"/><stop offset="100%" stop-color="#bc4c00"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0" r="0.9"><stop offset="0%" stop-color="#0969da" stop-opacity=".16"/><stop offset="100%" stop-color="#0969da" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0" r="0.9"><stop offset="0%" stop-color="#1a7f37" stop-opacity=".16"/><stop offset="100%" stop-color="#1a7f37" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3" cx="0.5" cy="0" r="0.9"><stop offset="0%" stop-color="#8250df" stop-opacity=".16"/><stop offset="100%" stop-color="#8250df" stop-opacity="0"/></radialGradient>
    <radialGradient id="g4" cx="0.5" cy="0" r="0.9"><stop offset="0%" stop-color="#bc4c00" stop-opacity=".16"/><stop offset="100%" stop-color="#bc4c00" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d0d7de" opacity="0.5"/>
    </pattern>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="418" rx="14"/></clipPath>
    <style>
      .f { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .ttl  { fill: #1f2328; font-weight: 700; }
      .desc { fill: #59636e; }
      .num  { fill: #d0d7de; font-weight: 700; }
      .ico  { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .chev { stroke: #d0d7de; stroke-width: 2; fill: none; stroke-linecap: round; }
      .rail { stroke: #d0d7de; stroke-width: 2; stroke-linecap: round; }
      .pulse { stroke: url(#flow); stroke-width: 3; fill: none; stroke-linecap: round;
               stroke-dasharray: 846; stroke-dashoffset: 846;
               animation: draw 8s cubic-bezier(.45,.05,.35,1) infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 846 } 55%,100% { stroke-dashoffset: 0 } }
      .wake { animation: wake 8s ease-in-out infinite; }
      @keyframes wake { 0%,5% { opacity: .45 } 11%,88% { opacity: 1 } 96%,100% { opacity: .45 } }
      .k2 { animation-delay: .8s } .k3 { animation-delay: 1.6s } .k4 { animation-delay: 2.4s }
      .dot { animation: dotlit 8s ease-in-out infinite; }
      @keyframes dotlit { 0%,5% { r: 6 } 11%,88% { r: 8 } 96%,100% { r: 6 } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="418" rx="14" fill="url(#panel)" stroke="url(#edge)" stroke-width="2.5"/>
  <g clip-path="url(#clip)"><rect x="1" y="65" width="1198" height="354" fill="url(#dots)"/></g>

  <circle cx="34" cy="34" r="6" fill="#ff5f57"/>
  <circle cx="56" cy="34" r="6" fill="#febc2e"/>
  <circle cx="78" cy="34" r="6" fill="#28c840"/>
  <text class="m" x="104" y="39" font-size="13" fill="#818b98">ilyass-hakim — the whole stack</text>
  <text class="m" x="1164" y="39" font-size="11" fill="#afb8c1" text-anchor="end">four layers · one engineer</text>
  <path d="M1 64 H1199" stroke="#d0d7de" stroke-width="1"/>

  <path class="rail"  d="M177 108 H1023"/>
  <path class="pulse" d="M177 108 H1023"/>

  <g class="chev">
    <path class="wake k2" d="M314 232 l9 9 l-9 9"/>
    <path class="wake k3" d="M596 232 l9 9 l-9 9"/>
    <path class="wake k4" d="M878 232 l9 9 l-9 9"/>
  </g>

  <g class="wake">
    <circle class="dot" cx="177" cy="108" r="6" fill="#0969da"/>
    <rect x="46" y="140" width="262" height="250" rx="12" class="card"/>
    <rect x="46" y="140" width="262" height="120" rx="12" fill="url(#g1)"/>
    <rect x="58" y="140" width="238" height="3.5" rx="2" fill="#0969da"/>
    <text class="m num" x="288" y="170" font-size="13" text-anchor="end">01</text>
    <circle cx="177" cy="198" r="27" fill="none" stroke="#0969da" stroke-width="1.5" opacity=".75"/>
    <g class="ico" stroke="#0969da" transform="translate(177,198)">
      <path d="M-6 -6 L-12 0 L-6 6"/><path d="M6 -6 L12 0 L6 6"/><path d="M2.5 -8.5 L-2.5 8.5"/>
    </g>
    <text class="f ttl" x="177" y="256" font-size="18" text-anchor="middle">Development</text>
    <text class="m" x="177" y="277" font-size="10" letter-spacing="2" text-anchor="middle" fill="#0969da">BUILD IT</text>
    <path d="M86 294 H268" stroke="#eaeef2" stroke-width="1"/>
    <text class="m desc" x="177" y="317" font-size="11.5" text-anchor="middle">services and interfaces</text>
    <text class="m desc" x="177" y="337" font-size="11.5" text-anchor="middle">data models</text>
    <text class="m desc" x="177" y="357" font-size="11.5" text-anchor="middle">integrations</text>
  </g>

  <g class="wake k2">
    <circle class="dot k2" cx="459" cy="108" r="6" fill="#1a7f37"/>
    <rect x="328" y="140" width="262" height="250" rx="12" class="card"/>
    <rect x="328" y="140" width="262" height="120" rx="12" fill="url(#g2)"/>
    <rect x="340" y="140" width="238" height="3.5" rx="2" fill="#1a7f37"/>
    <text class="m num" x="570" y="170" font-size="13" text-anchor="end">02</text>
    <circle cx="459" cy="198" r="27" fill="none" stroke="#1a7f37" stroke-width="1.5" opacity=".75"/>
    <g class="ico" stroke="#1a7f37" transform="translate(459,198)">
      <path d="M0 -12 L10 -7 V2 C10 8 5 11 0 12.5 C-5 11 -10 8 -10 2 V-7 Z"/>
      <path d="M-4.5 0 l3 3 l5.5 -6"/>
    </g>
    <text class="f ttl" x="459" y="256" font-size="18" text-anchor="middle">DevSecOps</text>
    <text class="m" x="459" y="277" font-size="10" letter-spacing="2" text-anchor="middle" fill="#1a7f37">SHIP IT</text>
    <path d="M368 294 H550" stroke="#eaeef2" stroke-width="1"/>
    <text class="m desc" x="459" y="317" font-size="11.5" text-anchor="middle">build and test automation</text>
    <text class="m desc" x="459" y="337" font-size="11.5" text-anchor="middle">security gates</text>
    <text class="m desc" x="459" y="357" font-size="11.5" text-anchor="middle">artifacts and releases</text>
  </g>

  <g class="wake k3">
    <circle class="dot k3" cx="741" cy="108" r="6" fill="#8250df"/>
    <rect x="610" y="140" width="262" height="250" rx="12" class="card"/>
    <rect x="610" y="140" width="262" height="120" rx="12" fill="url(#g3)"/>
    <rect x="622" y="140" width="238" height="3.5" rx="2" fill="#8250df"/>
    <text class="m num" x="852" y="170" font-size="13" text-anchor="end">03</text>
    <circle cx="741" cy="198" r="27" fill="none" stroke="#8250df" stroke-width="1.5" opacity=".75"/>
    <g class="ico" stroke="#8250df" transform="translate(741,198)">
      <path d="M-11 6 a6 6 0 0 1 1.7 -11.8 a7.8 7.8 0 0 1 14.9 1.7 a5.6 5.6 0 0 1 0.2 10.1 Z"/>
    </g>
    <text class="f ttl" x="741" y="256" font-size="17" text-anchor="middle">Cloud &amp; Orchestration</text>
    <text class="m" x="741" y="277" font-size="10" letter-spacing="2" text-anchor="middle" fill="#8250df">RUN IT</text>
    <path d="M650 294 H832" stroke="#eaeef2" stroke-width="1"/>
    <text class="m desc" x="741" y="317" font-size="11.5" text-anchor="middle">containerised workloads</text>
    <text class="m desc" x="741" y="337" font-size="11.5" text-anchor="middle">environments and scaling</text>
    <text class="m desc" x="741" y="357" font-size="11.5" text-anchor="middle">configuration</text>
  </g>

  <g class="wake k4">
    <circle class="dot k4" cx="1023" cy="108" r="6" fill="#bc4c00"/>
    <rect x="892" y="140" width="262" height="250" rx="12" class="card"/>
    <rect x="892" y="140" width="262" height="120" rx="12" fill="url(#g4)"/>
    <rect x="904" y="140" width="238" height="3.5" rx="2" fill="#bc4c00"/>
    <text class="m num" x="1134" y="170" font-size="13" text-anchor="end">04</text>
    <circle cx="1023" cy="198" r="27" fill="none" stroke="#bc4c00" stroke-width="1.5" opacity=".75"/>
    <g class="ico" stroke="#bc4c00" transform="translate(1023,198)">
      <rect x="-11" y="-11" width="22" height="7" rx="1.8"/>
      <rect x="-11" y="-2" width="22" height="7" rx="1.8"/>
      <path d="M-7 -7.5 h0.01"/><path d="M-7 1.5 h0.01"/>
      <path d="M-5 12 l3.5 -3 l-3.5 -3"/><path d="M1 12 h7"/>
    </g>
    <text class="f ttl" x="1023" y="256" font-size="18" text-anchor="middle">Linux &amp; Systems</text>
    <text class="m" x="1023" y="277" font-size="10" letter-spacing="2" text-anchor="middle" fill="#bc4c00">OPERATE IT</text>
    <path d="M932 294 H1114" stroke="#eaeef2" stroke-width="1"/>
    <text class="m desc" x="1023" y="317" font-size="11.5" text-anchor="middle">provisioning and users</text>
    <text class="m desc" x="1023" y="337" font-size="11.5" text-anchor="middle">networking and services</text>
    <text class="m desc" x="1023" y="357" font-size="11.5" text-anchor="middle">monitoring</text>
  </g>
</svg>
