<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="st">
  <title id="st">The whole stack — development, DevSecOps, cloud and orchestration, Linux and systems administration.</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="edge" x1="-0.7" y1="0" x2="-0.2" y2="0">
      <stop offset="0%" stop-color="#d0d7de"/><stop offset="45%" stop-color="#0969da"/>
      <stop offset="55%" stop-color="#8250df"/><stop offset="100%" stop-color="#d0d7de"/>
      <animate attributeName="x1" values="-0.7;1.0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-0.2;1.5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="spineG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0969da"/><stop offset="33%" stop-color="#1a7f37"/>
      <stop offset="66%" stop-color="#8250df"/><stop offset="100%" stop-color="#bc4c00"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d0d7de" opacity="0.55"/>
    </pattern>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="458" rx="14"/></clipPath>
    <style>
      .f { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .band { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .ttl  { fill: #1f2328; font-weight: 700; }
      .desc { fill: #59636e; }
      .note { fill: #818b98; }
      .ico  { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .lane { animation: lane 8s ease-in-out infinite; }
      @keyframes lane { 0%,4% { opacity: .55 } 10%,30% { opacity: 1 } 38%,100% { opacity: .55 } }
      .b2 { animation-delay: .9s } .b3 { animation-delay: 1.8s } .b4 { animation-delay: 2.7s }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="458" rx="14" fill="url(#panel)" stroke="url(#edge)" stroke-width="2.5"/>
  <g clip-path="url(#clip)"><rect x="1" y="65" width="1198" height="394" fill="url(#dots)"/></g>

  <circle cx="34" cy="34" r="6" fill="#ff5f57"/>
  <circle cx="56" cy="34" r="6" fill="#febc2e"/>
  <circle cx="78" cy="34" r="6" fill="#28c840"/>
  <text class="m" x="104" y="39" font-size="13" fill="#818b98">ilyass-hakim — the whole stack</text>
  <text class="m" x="1164" y="39" font-size="11" fill="#afb8c1" text-anchor="end">four layers · one engineer</text>
  <path d="M1 64 H1199" stroke="#d0d7de" stroke-width="1"/>

  <path id="spine" d="M32 132 V402" stroke="url(#spineG)" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/>
  <circle r="4.5" fill="#1f2328">
    <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.08;.62;1" calcMode="linear">
      <mpath xlink:href="#spine"/>
    </animateMotion>
  </circle>
  <g stroke="#d0d7de" stroke-width="1.5">
    <path d="M32 132 H60"/><path d="M32 222 H60"/><path d="M32 312 H60"/><path d="M32 402 H60"/>
  </g>

  <g class="lane">
    <rect x="60" y="94" width="1080" height="76" rx="10" class="band"/>
    <rect x="60" y="94" width="4" height="76" rx="2" fill="#0969da"/>
    <circle cx="112" cy="132" r="21" fill="none" stroke="#0969da" stroke-width="1.5" opacity=".7"/>
    <g class="ico" stroke="#0969da" transform="translate(112,132)">
      <path d="M-5 -5 L-10 0 L-5 5"/><path d="M5 -5 L10 0 L5 5"/><path d="M2 -7 L-2 7"/>
    </g>
    <text class="f ttl" x="158" y="128" font-size="20">Development</text>
    <text class="m desc" x="158" y="151" font-size="12">designing and building the software itself — services, interfaces, data models, integrations</text>
  </g>

  <g class="lane b2">
    <rect x="60" y="184" width="1080" height="76" rx="10" class="band"/>
    <rect x="60" y="184" width="4" height="76" rx="2" fill="#1a7f37"/>
    <circle cx="112" cy="222" r="21" fill="none" stroke="#1a7f37" stroke-width="1.5" opacity=".7"/>
    <g class="ico" stroke="#1a7f37" transform="translate(112,222)">
      <path d="M0 -10 L8 -6 V1 C8 6 4 9 0 10.5 C-4 9 -8 6 -8 1 V-6 Z"/>
      <path d="M-3.5 0 l2.5 2.5 l4.5 -5"/>
    </g>
    <text class="f ttl" x="158" y="218" font-size="20">DevSecOps</text>
    <text class="m desc" x="158" y="241" font-size="12">automating the path to production — build, test, security gates, artifacts, release</text>
  </g>

  <g class="lane b3">
    <rect x="60" y="274" width="1080" height="76" rx="10" class="band"/>
    <rect x="60" y="274" width="4" height="76" rx="2" fill="#8250df"/>
    <circle cx="112" cy="312" r="21" fill="none" stroke="#8250df" stroke-width="1.5" opacity=".7"/>
    <g class="ico" stroke="#8250df" transform="translate(112,312)">
      <path d="M-9 5 a5 5 0 0 1 1.4 -9.8 a6.5 6.5 0 0 1 12.4 1.4 a4.7 4.7 0 0 1 0.2 8.4 Z"/>
    </g>
    <text class="f ttl" x="158" y="308" font-size="20">Cloud &amp; Orchestration</text>
    <text class="m desc" x="158" y="331" font-size="12">packaging workloads and running them across machines — environments, scaling, configuration</text>
  </g>

  <g class="lane b4">
    <rect x="60" y="364" width="1080" height="76" rx="10" class="band"/>
    <rect x="60" y="364" width="4" height="76" rx="2" fill="#bc4c00"/>
    <circle cx="112" cy="402" r="21" fill="none" stroke="#bc4c00" stroke-width="1.5" opacity=".7"/>
    <g class="ico" stroke="#bc4c00" transform="translate(112,402)">
      <rect x="-9" y="-9" width="18" height="6" rx="1.5"/>
      <rect x="-9" y="-1" width="18" height="6" rx="1.5"/>
      <path d="M-5.5 -6 h0.01"/><path d="M-5.5 2 h0.01"/>
      <path d="M-4 10 l3 -2.5 l-3 -2.5"/><path d="M1 10 h6"/>
    </g>
    <text class="f ttl" x="158" y="398" font-size="20">Linux &amp; Systems Administration</text>
    <text class="m desc" x="158" y="421" font-size="12">the machines underneath — provisioning, users and permissions, networking, services, monitoring</text>
  </g>

  <text class="m note" x="1120" y="132" font-size="10.5" text-anchor="end">what gets built</text>
  <text class="m note" x="1120" y="222" font-size="10.5" text-anchor="end">how it ships</text>
  <text class="m note" x="1120" y="312" font-size="10.5" text-anchor="end">where it runs</text>
  <text class="m note" x="1120" y="402" font-size="10.5" text-anchor="end">what it runs on</text>
</svg>
